<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taekwondo-Adventskalender</title>
<meta name="description" content="24 Türchen, 24 Taekwondo-Übungen: ein Adventskalender für den Sabeomnim.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>">
<style>
  :root{
    --bg:#0f1b2d; --ink:#f5f1e8; --muted:#b9c3d3;
    --red:#c8102e; --red-d:#8f0b20; --gold:#e8b84a; --blue:#2f5fb3; --white:#fbfaf6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(ellipse at top,#1f3a63 0%,var(--bg) 60%) fixed, var(--bg);
    min-height:100vh; overflow-x:hidden;
  }
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 16px 48px}
  header{text-align:center;margin-bottom:22px}
  .hangul{font-size:15px;letter-spacing:.3em;color:var(--gold);opacity:.9}
  h1{font-size:clamp(28px,6vw,46px);margin:.15em 0 .1em;line-height:1.1}
  h1 span{color:var(--gold)}
  .dedic{color:var(--ink);font-size:18px;margin:6px 0 2px}
  .from{color:var(--muted);font-size:15px;margin:0;font-style:italic}
  .belt{height:10px;max-width:420px;margin:16px auto 0;border-radius:5px;
    background:linear-gradient(90deg,#fff 0 16.6%,#f4d03f 16.6% 33.3%,#2ecc71 33.3% 50%,#2f6fd6 50% 66.6%,#d62828 66.6% 83.3%,#111 83.3%);
    box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .status{text-align:center;margin:18px auto 22px;max-width:560px;color:var(--muted);font-size:15px}
  .progress{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(6,1fr);gap:14px}}

  .door{position:relative;aspect-ratio:1/1.1;perspective:900px;cursor:pointer;border:0;padding:0;background:none;color:inherit;font:inherit}
  .door:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:var(--radius)}
  .inside{position:absolute;inset:0;border-radius:var(--radius);background:var(--white);color:#1a1a1a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;
    box-shadow:inset 0 0 0 3px var(--gold)}
  .door.done .inside{box-shadow:inset 0 0 0 3px #178a5b}
  .door.done .inside::after{content:"✓";position:absolute;top:4px;right:8px;color:#178a5b;font-weight:800}
  .inside .emo{font-size:clamp(26px,6vw,40px)}
  .inside .t{font-size:11px;font-weight:600;line-height:1.2;color:#333}
  .leaf{position:absolute;top:0;bottom:0;width:50%;transition:transform .7s cubic-bezier(.4,.1,.2,1);backface-visibility:hidden;
    background:linear-gradient(145deg,var(--red),var(--red-d));box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
  .leaf.l{left:0;border-radius:var(--radius) 0 0 var(--radius);transform-origin:left center;border-right:1px solid rgba(0,0,0,.35)}
  .leaf.r{right:0;border-radius:0 var(--radius) var(--radius) 0;transform-origin:right center}
  .door:nth-child(3n+2) .leaf{background:linear-gradient(145deg,var(--blue),#1d3d78)}
  .door:nth-child(5n+4) .leaf{background:linear-gradient(145deg,#24324d,#141f33)}
  .door.d24 .leaf{background:linear-gradient(145deg,#f0c75e,#b8861f)}
  .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    font-size:clamp(24px,6vw,38px);font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.45);transition:opacity .3s}
  .num small{position:absolute;bottom:8%;font-size:10px;font-weight:600;letter-spacing:.08em;opacity:.75}
  .door.open .leaf.l{transform:rotateY(-105deg)}
  .door.open .leaf.r{transform:rotateY(105deg)}
  .door.open .num{opacity:0}
  .door.locked::after{content:"🔒";position:absolute;top:6px;right:8px;font-size:12px;opacity:.7}
  .door.today:not(.open){animation:pulse 2s infinite}
  .door.today:not(.open) .leaf{box-shadow:inset 0 0 0 3px var(--gold)}
  @keyframes pulse{50%{transform:scale(1.05)}}
  .door.shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#0b1422;color:var(--ink);
    padding:12px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.15);transition:transform .35s;z-index:20;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .overlay{position:fixed;inset:0;background:rgba(5,10,20,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex}
  .modal{background:var(--white);color:#1d1d1d;border-radius:18px;max-width:580px;width:100%;max-height:88vh;overflow:auto;
    padding:26px 22px 22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .modal .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;cursor:pointer;color:#666;line-height:1}
  .modal .head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .modal .big{font-size:48px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:#fff;margin-right:6px}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:#ece8de;color:#444}
  .modal h2{margin:6px 0 0;font-size:22px;line-height:1.2}
  .modal .day{font-size:13px;color:#777;margin-top:4px}
  .modal p,.modal li{line-height:1.55;font-size:15.5px}
  .modal ol{padding-left:22px;margin:8px 0}
  .modal li{margin-bottom:4px}
  .kr{color:#7a3db8;font-weight:600}
  .box{padding:10px 12px;border-radius:8px;margin-top:12px;font-size:15px;line-height:1.5}
  .tip{background:#fff4d6;border-left:4px solid var(--gold)}
  .msg{background:#fff;border:2px dashed var(--gold);border-radius:12px;padding:16px;margin-top:14px;font-size:16px;line-height:1.6;white-space:pre-line}
  .btn{display:inline-block;margin-top:16px;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--red);color:#fff}
  .btn.done{background:#178a5b}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">
  <header>
    <div class="hangul">태 권 도</div>
    <h1>Taekwondo-<span>Adventskalender</span></h1>
    <p class="dedic" id="dedic"></p>
    <p class="from" id="from"></p>
    <div class="belt"></div>
  </header>

  <div class="status">
    <div id="statusText"></div>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <main class="grid" id="grid" aria-label="Adventskalender-Türchen"></main>

  <footer>
    Jeden Tag eine neue Übung, ganz allein und ohne Partner machbar.<br>
    Vorher immer aufwärmen. Bei Schmerzen bitte aufhören.<br>
    <button id="reset">Fortschritt zurücksetzen</button>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ======================= HIER ANPASSEN ======================= */
const WIDMUNG = "Für Sabeomnim Claus Moos";            // z.B. "Für Sabeomnim Kim"
const VON     = "Von deiner Schülerin Kristina";   // z.B. "Von Lena aus der Dienstagsgruppe"
const DANKE   = `Lieber Sabeomnim,

danke für jede Trainingsstunde, deine Geduld und dafür, dass du uns immer wieder motivierst, über uns hinauszuwachsen.
Ich wünsche dir frohe Weihnachten und einen guten Start ins neue Jahr!

Kamsahamnida! 🙇`;
/* ============================================================= */

const CAT = {
  mobil:{l:"Beweglichkeit",c:"#7a3db8"}, kraft:{l:"Kraft",c:"#c8102e"}, technik:{l:"Technik",c:"#178a5b"},
  speed:{l:"Schnelligkeit",c:"#d98a00"}, ausdauer:{l:"Ausdauer",c:"#2f5fb3"}, balance:{l:"Balance",c:"#0e8a8a"},
  ruhe:{l:"Regeneration",c:"#5b6b82"}, finale:{l:"Heiligabend",c:"#b8861f"}
};

const DAYS = [
 {cat:"mobil", icon:"🔥", title:"Aufwärm-Flow", time:"5 Min.",
  steps:["30 Sek. Gelenke kreisen: Fußgelenke, Knie, Hüfte, Schultern, Nacken","30 Sek. Hampelmann","30 Sek. Skippings auf der Stelle","30 Sek. Anfersen","Beinpendel nach vorne: 10× pro Bein","Beinpendel zur Seite: 10× pro Bein","10 Ausfallschritte mit Oberkörperrotation"],
  tip:"Mit jeder Wiederholung etwas größer werden. Die Pendel sind locker und dynamisch, kein Tritt mit Kraft."},

 {cat:"technik", icon:"🪜", title:"Ap-Chagi-Leiter", time:"ca. 6 Min.",
  steps:["10 Ap Chagi tief (Kniehöhe) pro Bein","10 Ap Chagi mittel (Bauchhöhe) pro Bein","10 Ap Chagi hoch (Kopfhöhe) pro Bein","Zum Schluss 5 pro Bein mit 3 Sek. Halt in der Ausholposition vor und nach dem Tritt"],
  tip:"Die Hüfte schiebt mit, der Oberkörper bleibt aufrecht. Das Zurückziehen ist genauso wichtig wie der Tritt."},

 {cat:"kraft", icon:"🐢", title:"Zeitlupen-Dollyo", time:"ca. 8 Min.",
  steps:["Knie in die Ausholposition für den Dollyo Chagi ziehen und 20 Sek. halten","Bein in 5 Sek. langsam strecken","5 Sek. gestreckt halten","In 5 Sek. zurück in die Ausholposition","5 Wiederholungen pro Bein, ohne abzusetzen"],
  tip:"Wenn du dich an einer Wand festhältst, kannst du dich ganz auf die Linie des Tritts konzentrieren. Ohne Wand trainierst du zusätzlich die Balance."},

 {cat:"speed", icon:"⚡", title:"Explosive Sprünge", time:"3 Runden",
  steps:["10 Hocksprünge (Knie zur Brust)","10 Wechselsprünge im Ausfallschritt","10 Skater-Sprünge (seitlich von Bein zu Bein)","5 Strecksprünge mit maximaler Höhe","60 Sek. Pause"],
  tip:"Weich landen, und zwar auf dem Fußballen. Es geht um Explosivität, nicht um Tempo bis zur Erschöpfung."},

 {cat:"mobil", icon:"🤸", title:"Spagat-Routine", time:"ca. 8 Min.",
  steps:["Schmetterling: 45 Sek.","Tiefer Ausfallschritt mit Knie am Boden: 45 Sek. pro Seite","Halber Spagat (vorderes Bein gestreckt, Oberkörper nach vorne): 45 Sek. pro Seite","Frontspagat oder so tief wie möglich: 45 Sek. pro Seite","Seitspagat-Grätsche im Stand oder Sitz: 60 Sek."],
  tip:"Nicht wippen. Beim Ausatmen jeweils ein kleines Stück tiefer sinken."},

 {cat:"technik", icon:"👣", title:"Matsogi-Footwork", time:"3 × 45 Sek.",
  steps:["Runde 1: kleine Schritte vor und zurück, immer locker auf den Fußballen","Runde 2: Stellungswechsel im Sprung (links/rechts vorne)","Runde 3: Seitschritte und Ausweichen mit Drehung","Zwischen den Runden 15 Sek. Pause"],
  tip:"Nie mit beiden Füßen gleichzeitig „festkleben“. Der Rhythmus hält dich jederzeit trittbereit."},

 {cat:"kraft", icon:"🧱", title:"Core-Zirkel", time:"3 Runden",
  steps:["45 Sek. Unterarmstütz","30 Sek. Seitstütz pro Seite","20 Russian Twists","15 Beinheben in Rückenlage","30 Sek. Hollow Hold","60 Sek. Pause"],
  tip:"Ein starker Rumpf macht Tritte stabiler und Drehungen schneller."},

 {cat:"balance", icon:"🦩", title:"Kranich-Tritte", time:"ca. 6 Min.",
  steps:["Auf einem Bein: Yop Chagi in Zeitlupe, 5×, ohne den Fuß abzusetzen","Direkt danach 5× Dollyo Chagi, weiterhin ohne Absetzen","Seitenwechsel","Profi-Stufe: die Ausholposition 15 Sek. mit geschlossenen Augen halten"],
  tip:"Blick auf einen festen Punkt richten und die Fußsohle des Standbeins aktiv in den Boden „krallen“."},

 {cat:"speed", icon:"🎾", title:"Tennisball-Reaktion", time:"ca. 6 Min.",
  steps:["In Kampfstellung einen Tennisball auf Kopfhöhe halten, fallen lassen und fangen, bevor er ein zweites Mal aufspringt: 10×","Ball fallen lassen, schnell einen Ap Chagi in die Luft treten, dann fangen: 5× pro Bein","Ball fallen lassen, einen Kaunde Jirugi links und rechts schlagen, dann fangen: 10×","Ball gegen die Wand werfen, einen Seitschritt machen und den Ball fangen: 10× pro Seite"],
  tip:"Steigerung: Lass den Ball aus Brusthöhe fallen statt aus Kopfhöhe. Dann bleibt dir weniger Zeit."},

 {cat:"technik", icon:"🪞", title:"Hyong gespiegelt", time:"ca. 10 Min.",
  steps:["Lauf eine Hyong, die du sehr gut kannst, einmal ganz normal","Danach komplett spiegelverkehrt: Jede Drehung und jede Technik geht zur anderen Seite","Dann noch einmal gespiegelt, diesmal mit vollem Tempo und Kihap"],
  tip:"Klingt einfach, ist es aber nicht. Das Gehirn muss jede Bewegung neu „denken“. Das schult die schwächere Seite."},

 {cat:"ausdauer", icon:"⏱️", title:"Tabata-Tritte", time:"4 Min.",
  steps:["20 Sek. Dollyo Chagi im Wechsel, so schnell wie möglich","10 Sek. Pause","Insgesamt 8 Runden","Runden 5–8: im Wechselsprung treten"],
  tip:"Tritte zählen. Das Ziel ist, in der letzten Runde noch genauso viele zu schaffen wie in der ersten."},

 {cat:"mobil", icon:"🌀", title:"Hüft-Mobility", time:"ca. 8 Min.",
  steps:["90/90-Sitz: 10 Seitenwechsel langsam drehen","Hüftkreisen im Vierfüßlerstand: 10× pro Seite vorwärts und rückwärts","Cossack Squats (tiefe Seitkniebeuge): 8 pro Seite","Froschdehnung: 60 Sek."],
  tip:"Die Hüfte entscheidet über die Höhe von Yop Chagi und Dollyo Chagi."},

 {cat:"technik", icon:"🔗", title:"Kombi des Tages", time:"5 × pro Seite",
  steps:["Ap Chagi mit dem hinteren Bein","Absetzen und sofort Dollyo Chagi mit demselben Bein","Absetzen in die Drehung: Dwit Chagi","Zurück in die Kampfstellung"],
  tip:"Erst langsam und sauber, dann ein flüssiger Rhythmus, zuletzt volles Tempo."},

 {cat:"kraft", icon:"🦵", title:"Beinkraft", time:"3 Runden",
  steps:["10 bulgarische Kniebeugen pro Bein (hinterer Fuß erhöht)","10 Kniebeugen mit 3 Sek. Abwärtsbewegung","20 Wadenheben auf einem Bein pro Seite","30 Sek. Annun Sogi (Reitersitz) halten","60 Sek. Pause"],
  tip:"Starke Beine bedeuten höhere Sprünge, schnellere Tritte und weniger Verletzungen."},

 {cat:"technik", icon:"🔁", title:"Drei Tritte, ein Bein", time:"5 × pro Seite",
  steps:["Yop Chagi","Ohne abzusetzen: Dollyo Chagi","Ohne abzusetzen: Naeryo Chagi (Axttritt)","Erst danach den Fuß kontrolliert absetzen"],
  tip:"Das Standbein bleibt leicht gebeugt. Die Kraft kommt aus der Hüfte, nicht aus Schwung."},

 {cat:"technik", icon:"🎯", title:"Dwit Chagi auf Präzision", time:"10 × pro Seite",
  steps:["Ziel markieren: eine Pratze, ein Kissen an der Wand oder ein Klebepunkt","Aus der Kampfstellung drehen und dabei über die Schulter das Ziel anvisieren","Gerader Tritt mit der Ferse, die Fußspitze zeigt nach unten","Nach jedem Tritt sofort zurück in die Stellung"],
  tip:"Der Blick kommt vor dem Tritt. Wer das Ziel nicht sieht, trifft es selten."},

 {cat:"ausdauer", icon:"🥊", title:"Schattenkampf mit Themen", time:"3 × 2 Min.",
  steps:["Runde 1: nur Konter, also erst ausweichen, dann treten","Runde 2: nur Kombinationen aus mindestens drei Techniken","Runde 3: freier Kampf mit Fokus auf Kopftritte","1 Min. Pause zwischen den Runden"],
  tip:"Stell dir einen echten Gegner mit einem bestimmten Kampfstil vor."},

 {cat:"kraft", icon:"👊", title:"Faust-Power", time:"3 Runden",
  steps:["10 Liegestütze auf den Fäusten","30 Sek. schnelle Fauststöße (Kaunde Jirugi) im Annun Sogi","20 Schulter-Taps im Liegestütz","30 Sek. Fauststöße mit einer kleinen Wasserflasche in jeder Hand","60 Sek. Pause"],
  tip:"Bei Liegestützen auf den Fäusten sind die Handgelenke gerade, getragen wird auf den ersten beiden Knöcheln."},

 {cat:"speed", icon:"🚀", title:"Sprungtritte", time:"ca. 8 Min.",
  steps:["Vorübung: 10 Sprünge mit beiden Knien zur Brust","Twimyo Ap Chagi (Ap Chagi im Sprung): 5 pro Bein","Ap Chagi im Wechselsprung: 10 im Wechsel","Twimyo Dollyo Chagi (Dollyo Chagi im Sprung): 5 pro Bein"],
  tip:"Der Absprung kommt aus dem Knie des Schwungbeins, das zieht dich nach oben."},

 {cat:"technik", icon:"🧱", title:"Kontroll-Tritte an der Wand", time:"ca. 8 Min.",
  steps:["Stell dich in Kampfstellung seitlich vor eine Wand","Dollyo Chagi mit vollem Tempo so treten, dass der Fuß 2–3 cm vor der Wand stoppt: 10× pro Bein","Dasselbe mit Yop Chagi: 10× pro Bein","Zum Schluss Ap Chagi frontal zur Wand: 10× pro Bein"],
  tip:"Volle Geschwindigkeit, aber kein Kontakt. Das trainiert Distanzgefühl und Kontrolle. Wer die Wand berührt, macht 5 Kniebeugen 😉"},

 {cat:"ruhe", icon:"🧘", title:"Atem & Fokus", time:"5 Min.",
  steps:["Im Fersen- oder Schneidersitz aufrecht hinsetzen, Augen schließen","Box-Atmung: 4 Sek. einatmen, 4 Sek. halten, 4 Sek. ausatmen, 4 Sek. halten","10 Runden","Zum Abschluss: Geh im Kopf eine Hyong Schritt für Schritt durch"],
  tip:"Mentales Training zählt auch: Visualisierung verbessert nachweislich die Bewegungsqualität."},

 {cat:"speed", icon:"💨", title:"Doppel-Dollyo-Speed", time:"5 × 20 Sek.",
  steps:["Doppel-Dollyo-Chagi: zwei schnelle Halbkreistritte mit Beinwechsel in der Luft","20 Sek. so viele saubere Doppel wie möglich","40 Sek. Pause","5 Runden, dabei jede Runde die Anzahl notieren"],
  tip:"Nicht zu hoch treten. Bauchhöhe reicht, es geht ums Tempo."},

 {cat:"ruhe", icon:"🛌", title:"Regenerations-Tag", time:"10 Min.",
  steps:["Faszienrolle Waden: 60 Sek. pro Seite","Oberschenkel vorne und hinten: je 60 Sek. pro Seite","Oberer Rücken: 60 Sek.","Lockeres Dehnen der Hüfte und Beine nach Gefühl","Viel trinken und früh schlafen 😴"],
  tip:"Auch ein Sabeomnim braucht Pause. Morgen kommt das Finale!"},

 {cat:"finale", icon:"🎄", title:"Das 24er-Finale", time:"ca. 15 Min.",
  steps:["24 Ap Chagi","24 Dollyo Chagi","24 Yop Chagi","24 Kniebeugen","24 Sit-ups","24 Sek. Annun Sogi (Reitersitz)","24 Fauststöße mit Kihap beim letzten!"],
  tip:"Die Tritte im Wechsel, also links und rechts. Danach: frohe Weihnachten! 🎁",
  finale:true}
];

const ORDER = [7,15,2,20,11,4,18,1,23,9,13,6,22,16,3,10,19,24,5,12,17,8,21,14];
const KEY = "tkd-advent-teacher-v1";
const TEST = new URLSearchParams(location.search).has("test");

let state = {opened:[],done:[]};
try{ state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

const now = new Date(), m = now.getMonth(), d = now.getDate();
const unlocked = n => TEST || (m===11 ? d>=n : m<=1);
const daysUntil = n => Math.round((new Date(now.getFullYear(),11,n) - new Date(now.getFullYear(),m,d))/864e5);

document.getElementById("dedic").textContent = WIDMUNG;
document.getElementById("from").textContent = VON;
const grid = document.getElementById("grid");

ORDER.forEach(n=>{
  const x = DAYS[n-1];
  const b = document.createElement("button");
  b.className = "door" + (n===24?" d24":"");
  b.setAttribute("aria-label","Türchen "+n);
  b.innerHTML = `<div class="inside"><div class="emo">${x.icon}</div><div class="t">${x.title}</div></div>
    <div class="leaf l"></div><div class="leaf r"></div><div class="num">${n}<small>${n===24?"HEILIGABEND":""}</small></div>`;
  if(state.opened.includes(n)) b.classList.add("open");
  if(state.done.includes(n)) b.classList.add("done");
  if(!unlocked(n)) b.classList.add("locked");
  if(m===11 && d===n && !TEST) b.classList.add("today");
  b.addEventListener("click",()=>clickDoor(b,n));
  grid.appendChild(b);
});

function clickDoor(b,n){
  if(!unlocked(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const k = daysUntil(n);
    toast(k===1 ? "Noch 1 Tag Geduld! 🥋" : k>1 ? `Noch ${k} Tage. In Nae, Geduld ist auch eine Tugend 😉` : "Dieses Türchen ist noch zu.");
    return;
  }
  const first = !b.classList.contains("open");
  b.classList.add("open");
  if(!state.opened.includes(n)){ state.opened.push(n); save(); updateStatus(); }
  setTimeout(()=>showModal(n,b), first?650:0);
}

const overlay = document.getElementById("overlay"), modal = document.getElementById("modal");
function showModal(n,door){
  const x = DAYS[n-1], c = CAT[x.cat], done = state.done.includes(n);
  modal.innerHTML = `<button class="x" aria-label="Schließen">×</button>
    <div class="head"><div class="big">${x.icon}</div><div>
      <span class="badge" style="background:${c.c}">${c.l}</span><span class="chip">⏱ ${x.time}</span>
      <h2>${x.title}</h2><div class="day">Übung zum ${n}. Dezember</div></div></div>
    <ol>${x.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
    ${x.tip?`<div class="box tip">💡 <b>Tipp:</b> ${x.tip}</div>`:""}    ${x.finale?`<div class="msg"></div>`:""}
    <button class="btn ${done?"done":""}" id="doneBtn">${done?"✓ Erledigt!":"Übung erledigt"}</button>`;
  if(x.finale) modal.querySelector(".msg").textContent = DANKE;
  overlay.classList.add("show");
  modal.querySelector(".x").onclick = close;
  const db = modal.querySelector("#doneBtn");
  db.onclick = ()=>{
    if(!state.done.includes(n)){ state.done.push(n); save(); updateStatus(); }
    door.classList.add("done"); db.classList.add("done"); db.textContent = "✓ Erledigt!";
    toast(n===24 ? "Alle 24 geschafft? Frohe Weihnachten! 🎄" : "Stark! 💪 Kihap!");
  };
  modal.querySelector(".x").focus();
}
function close(){ overlay.classList.remove("show"); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) close(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });

let tt;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"),2600);
}

function updateStatus(){
  let txt;
  if(TEST) txt = "🧪 Testmodus: alle Türchen sind offen.";
  else if(m!==11 && m>1){ const k = daysUntil(1); txt = `Noch ${k} ${k===1?"Tag":"Tage"} bis zum ersten Türchen! 🎄`; }
  else if(m===11 && d<=24) txt = `Heute ist der ${d}. Dezember. ${state.opened.includes(d)?"Die heutige Übung ist schon offen 🎉":"Die heutige Übung wartet! ✨"}`;
  else txt = "Alle Türchen sind offen. Frohe Feiertage! 🎄";
  document.getElementById("statusText").innerHTML = `${txt}<br><small>${state.done.length}/24 Übungen erledigt</small>`;
  document.getElementById("bar").style.width = (state.done.length/24*100)+"%";
}
updateStatus();

document.getElementById("reset").onclick = ()=>{
  if(confirm("Wirklich alle geöffneten Türchen und erledigten Übungen zurücksetzen?")){
    state = {opened:[],done:[]}; save(); location.reload();
  }
};

/* Schnee */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("snow"), x = c.getContext("2d");
  let W,H; const f=[];
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  size(); addEventListener("resize",size);
  for(let i=0;i<Math.min(120,innerWidth/8);i++) f.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.5+.8,s:Math.random()*.6+.3,w:Math.random()*Math.PI*2});
  (function loop(){
    x.clearRect(0,0,W,H); x.fillStyle="rgba(255,255,255,.8)";
    for(const p of f){
      p.y+=p.s; p.w+=.01; p.x+=Math.sin(p.w)*.4;
      if(p.y>H){p.y=-5;p.x=Math.random()*W;}
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
